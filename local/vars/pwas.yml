# Web apps Chromium installs by itself on first launch (WebAppInstallForceList
# policy). They appear in the app launcher like normal apps. Policy-installed
# apps can't be removed from inside Chromium - delete them from this list.
#
# Each url is the app's *manifest id*, not just any page on the site. Chromium
# names an app after its manifest id, so these match the apps already installed
# by hand (Chromium adopts them instead of adding a second copy). That holds
# even before you sign in, when Chromium can't read Teams/Outlook's manifest
# and installs a placeholder named after this url. The id comment is
# the Chromium app id the url produces.
