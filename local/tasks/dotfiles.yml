---
- name: Check if dotfiles repo exists
  ansible.builtin.stat:
    path: ~/dotfiles/.git
  register: dotfiles_repo_status

- name: Clone dotfiles
  when: not dotfiles_repo_status.stat.exists
  ansible.builtin.git:
    # Private repo: bootstrap.sh runs `gh auth login` + `gh auth setup-git` first
    repo: https://github.com/eblakem/dotfiles.git
    dest: ~/dotfiles

# Real directories, so stow links each app's folder individually instead of
# folding all of ~/.config into the repo (which drags browser profiles,
# caches etc. into ~/dotfiles).
- name: Create base config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - ~/.config
    - ~/.local/bin
    - ~/.local/share/applications

- name: Stow dotfiles
  ansible.builtin.command: ./stow-adopt.sh
  args:
    chdir: ~/dotfiles
  register: stow_result
  changed_when: stow_result.stdout != ""
